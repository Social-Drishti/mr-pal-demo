    <!-- A placement agency is a local service; this is what makes that
         machine-readable rather than a claim in body copy. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EmploymentAgency",
        "name": "MR. PAL",
        "description": "Placement agency for caregivers, patient attendants, home nurses and home helpers across Mumbai.",
        "email": "care@mrpal.in",
        "telephone": "+919820012345",
        "priceRange": "$$",
        "areaServed": [
          "Bandra West",
          "Andheri East",
          "Powai",
          "Chembur",
          "Dadar",
          "Wadhale",
          "Kurla",
          "Borivali",
          "Malad",
          "Thane",
          "Fort",
          "Chembur North"
        ],
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Mumbai",
          "addressRegion": "Maharashtra",
          "addressCountry": "IN"
        },
        "openingHours": "Mo-Su 08:00-21:00"
      }
